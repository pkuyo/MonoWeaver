name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # Every code block in the site is pulled out of this project, so a change
      # here can break the build even when no Markdown changed.
      - 'tests/MonoWeaver.DocSamples/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/MonoWeaver.DocSamples/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued run supersedes the one waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install
        run: pip install -r docs/requirements.txt

      # --strict turns broken internal links, missing anchors and missing code
      # snippets into failures instead of quietly shipping them.
      - name: Build
        run: mkdocs build -f docs/mkdocs.yml --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    # Pull requests build the site but must not publish it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
