name: Build and package compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'MonoWeaver/**'
      - 'MonoWeaver.Fuzz/**'
      - 'tests/MonoWeaver.DocSamples/**'
      - 'benchmarks/MonoWeaver.Benchmarks/**'
      - 'README.md'
      - 'MonoWeaver.slnx'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'MonoWeaver/**'
      - 'MonoWeaver.Fuzz/**'
      - 'tests/MonoWeaver.DocSamples/**'
      - 'benchmarks/MonoWeaver.Benchmarks/**'
      - 'README.md'
      - 'MonoWeaver.slnx'
  workflow_dispatch:

jobs:
  compile-samples-tools:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: Latest
            label: Latest
          - flavor: Cecil10
            label: Cecil 0.10.4

    name: Compile samples/tools - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile documentation samples
        run: dotnet build tests/MonoWeaver.DocSamples/MonoWeaver.DocSamples.csproj -c Release -p:CecilFlavor=${{ matrix.flavor }}

      - name: Compile fuzz runner
        run: dotnet build MonoWeaver.Fuzz/MonoWeaver.Fuzz.csproj -c Release -p:CecilFlavor=${{ matrix.flavor }}

      - name: Compile benchmarks
        run: dotnet build benchmarks/MonoWeaver.Benchmarks/MonoWeaver.Benchmarks.csproj -c Release -p:CecilFlavor=${{ matrix.flavor }}

  package-validation:
    runs-on: windows-latest
    name: Package MonoWeaver.Cecil10 and MonoWeaver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack version 0.1.1
        run: |
          dotnet pack MonoWeaver/MonoWeaver.csproj -c Release -p:CecilFlavor=Cecil10 -p:Version=0.1.1 -p:ContinuousIntegrationBuild=true
          dotnet pack MonoWeaver/MonoWeaver.csproj -c Release -p:CecilFlavor=Latest -p:Version=0.1.1 -p:ContinuousIntegrationBuild=true

      - name: Verify package files
        shell: pwsh
        run: |
          $expected = @(
            'artifacts/nupkg/MonoWeaver.Cecil10.0.1.1.nupkg',
            'artifacts/nupkg/MonoWeaver.0.1.1.nupkg'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected package was not generated: $path"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-0.1.1
          path: artifacts/nupkg/*
